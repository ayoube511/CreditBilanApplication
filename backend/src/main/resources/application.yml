server:
  port: 8080

spring:
  application:
    name: credit-bilan-backend

  datasource:
    url: jdbc:mysql://localhost:3306/credit_bilan?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    validate-on-migrate: false

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:credit-bilan-documents}
  presigned-url-expiry-minutes: 30

jwt:
  secret: ${JWT_SECRET:credit-bilan-super-secret-key-change-this-in-production-minimum-256-bits}
  expiration-minutes: 60
  refresh-expiration-days: 7

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.creditbilan: INFO
    org.springframework.security: WARN
